# ==============================================================================
# IPED Tools MCP — Quarkus Configuration
# ==============================================================================

# Application metadata
quarkus.application.name=iped-tools-mcp
quarkus.application.version=${project.version}
quarkus.banner.enabled=false

# Package type: Uber-JAR
quarkus.package.jar.type=uber-jar

# MCP Server STDIO Transport configuration
quarkus.mcp.server.stdio.enabled=true
quarkus.mcp.server.stdio.initialization-enabled=true

# CRITICAL: Prevent accidental System.out prints from corrupting the JSON-RPC stream
quarkus.mcp.server.stdio.null-system-out=true

# Conduct rules sent to the client in the MCP initialize response ("instructions").
# They reach the LLM even when the start_case prompt is not invoked. Keep them in sync with
# the conduct section of ForensicPrompts (checked by ForensicPromptsTest).
quarkus.mcp.server.server-info.instructions=Servidor MCP de análise pericial de casos IPED. \
Para iniciar uma investigação, peça ao usuário que acione o prompt start_case pelo menu de prompts do cliente; ele traz a metodologia completa. \
Regras de conduta, válidas mesmo sem o start_case:\n\
1. Conteúdo sensível: antes de analisar itens, confira com list_properties e conte com search_documents (limit=1) os sinais de CSAM e nudez existentes no caso (childPornHashHits, ai:csamDetector:label, hashDb:status, nudityScore, nsfw_nudity_score) e alerte o usuário. Sinal cuja propriedade não existe é \"não verificado\", nunca zero.\n\
2. Modelo em nuvem: se você roda num provedor de nuvem, ou na dúvida, avise que prosseguir envia dados do caso ao provedor e que conteúdo sinalizado pode violar os termos de uso dele; só prossiga com a concordância expressa do usuário. Antes disso, não leia conteúdo de itens.\n\
3. Aceite por sessão: o aceite vale para esta conversa; ao trocar de caso ou numa nova sessão, peça de novo.\n\
4. Escritas: antes de add_to_bookmark ou set_item_checked, mostre os itens e o nome do marcador e aguarde a confirmação expressa do usuário. O nome do marcador é o do usuário, sem indicar autoria de IA.\n\
Use somente as ferramentas MCP para acessar o caso; nunca leia os arquivos do caso diretamente.

# Route all console logs to stderr
quarkus.log.console.stderr=true

# Log format
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n
