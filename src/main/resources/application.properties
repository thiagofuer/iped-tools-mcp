# ==============================================================================
# IPED Tools MCP — Quarkus Configuration
# ==============================================================================

# Application metadata
quarkus.application.name=iped-tools-mcp
quarkus.application.version=${project.version}
quarkus.banner.enabled=false

# Package type: Uber-JAR
quarkus.package.jar.type=uber-jar

# MCP Server STDIO Transport configuration
quarkus.mcp.server.stdio.enabled=true
quarkus.mcp.server.stdio.initialization-enabled=true

# CRITICAL: Prevent accidental System.out prints from corrupting the JSON-RPC stream
quarkus.mcp.server.stdio.null-system-out=true

# Route all console logs to stderr
quarkus.log.console.stderr=true

# Log format
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n
